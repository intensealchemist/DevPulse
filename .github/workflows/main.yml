name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_and_test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Linter
        run: npm run lint

      - name: Type Checking
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm test -- --passWithNoTests

      # Optional CI steps for Android/iOS builds would go here, 
      # but they require macos-latest and take significantly longer.
      # Linting, typing, and testing covers the code verification!
